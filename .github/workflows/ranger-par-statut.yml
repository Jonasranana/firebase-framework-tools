name: Ranger par statut (Pas éligible, Pas intéressé, Pas adapté, Mauvais numéro, NRP)
on:
  push:
    branches: [claude/ip5-energie-landing-8fhstc]
    paths: [.github/workflows/ranger-par-statut.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Ranger
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: "false"
          FROM_GROUP: mebarek
        run: node scripts/ranger-par-statut.mjs
