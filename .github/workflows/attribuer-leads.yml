name: Attribuer des leads

# Attribue N fiches Pac Pac jamais appelées (sans étiquette) à une personne (colonne « Attribué à »).
# Essai à blanc par défaut : il liste seulement les fiches retenues.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc (n'écrit rien)"
        type: boolean
        default: true
      count:
        description: "Nombre de fiches"
        type: string
        default: "50"
      deplacer:
        description: "Au lieu d'attribuer : déplacer dans « Nouveaux leads » les fiches déjà attribuées à cette personne aujourd'hui"
        type: boolean
        default: false
      who:
        description: "Attribuer à (Mebarek, Carole, Alexis)"
        type: string
        default: "Mebarek"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Attribuer
        if: ${{ !inputs.deplacer }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: ${{ inputs.dry_run }}
          COUNT: ${{ inputs.count }}
          WHO: ${{ inputs.who }}
        run: node scripts/attribuer-leads.mjs
      - name: Déplacer vers Nouveaux leads
        if: ${{ inputs.deplacer }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: ${{ inputs.dry_run }}
          WHO: ${{ inputs.who }}
        run: node scripts/deplacer-attribuees.mjs
