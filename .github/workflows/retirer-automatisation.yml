name: Retirer une automatisation du CRM

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nom exact de l'automatisation à retirer"
        type: string
        required: true

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Retirer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          NAME: ${{ inputs.name }}
        run: node scripts/remove-automation.mjs
