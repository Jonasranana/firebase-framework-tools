name: Archiver des colonnes de Pac Pac (ponctuel)

# Archive les colonnes listées (elles vont dans « Pac Pac archivé », avec leurs valeurs).
# ARCHIVER « non » = essai à blanc (liste seulement) ; « oui » = écrit (après le « go » de Jonas).
on:
  push:
    branches: [claude/optimistic-lamport-tc88wi]
    paths: [.github/workflows/archiver-colonnes.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Archiver
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          ARCHIVER: "oui"
          COLONNES: "commercial,mailAuto,dernierMail,chauffage,notesRapides,resume,ressenti,margeNette,montant,datePaiementPrevue,dateInstallPrevue,personnes,statutLed,villeChantier,appelsMois,dateVt,datePose,heureVt,heurePose,dateDepotMpr,mprRecue"
        run: node scripts/archiver-colonnes.mjs
