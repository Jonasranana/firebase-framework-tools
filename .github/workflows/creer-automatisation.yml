name: Créer une automatisation du CRM

# Utilisé par Claude (sur l'ordinateur) pour créer une automatisation décrite en français.
# Elle apparaît ensuite dans ⚡ Automatiser, où on peut l'activer, la désactiver ou la supprimer.
on:
  workflow_dispatch:
    inputs:
      json:
        description: "Automatisation (JSON : name, enabled, trigger, actions)"
        type: string
        required: true

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Créer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          AUTOMATION_JSON: ${{ inputs.json }}
        run: node scripts/create-automation.mjs
