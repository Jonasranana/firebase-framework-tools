name: Leads oubliés pendant la panne (lecture seule)
on:
  workflow_dispatch:
    inputs:
      depuis:
        description: "Date de début (AAAA-MM-JJ)"
        default: "2026-11-01"
  push:
    branches: [claude/ip5-energie-landing-8fhstc]
    paths: [scripts/diag-leads-oublies.mjs]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Diagnostic
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DEPUIS: ${{ inputs.depuis || '2026-11-01' }}
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          v=$(gcloud secrets versions access latest --secret=META_PAGE_TOKEN --project kachoto-7554c 2>/dev/null | tr -d '\r\n' || true)
          if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          export META_PAGE_TOKEN="$v"
          w=$(gcloud secrets versions access latest --secret=PRAIMY_API_KEY --project kachoto-7554c 2>/dev/null | tr -d '\r\n' || true)
          if [ -n "$w" ]; then echo "::add-mask::$w"; fi
          export PRAIMY_API_KEY="$w"
          node scripts/diag-leads-oublies.mjs
