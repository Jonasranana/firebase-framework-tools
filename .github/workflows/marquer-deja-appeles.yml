name: Marquer « Déjà appelé » (ponctuel)

on:
  push:
    branches: [claude/optimistic-lamport-tc88wi]
    paths: [.github/workflows/marquer-deja-appeles.yml]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Essai à blanc
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: "true"
          PHONES: "0686587604,0680837086x3,0658289823,0687911292,0617610970,0683585951,0670357651,0611550651,0786510611,0243291566,0687134662,0609750150,0673687215,0621965586"
          NAMES: "Fabien Mascourou|Teulier Patrice|Ferme de Cyrina|Fournier Bernard|Gironis Benoit|Gabeon|W & B|Pascal Paramelle|Pierre-Alain Taisne|Hyacinthe Menuiseries|Klene Mylene|Malabry Didier|Le Diouron LOIC|SCEA de Belinval|Vincent balligand|Nr aménagement"
          FROM: "vide,a_appeler"
        run: node scripts/marquer-deja-appeles.mjs
      - name: Écriture
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: "false"
          PHONES: "0686587604,0680837086x3,0658289823,0687911292,0617610970,0683585951,0670357651,0611550651,0786510611,0243291566,0687134662,0609750150,0673687215,0621965586"
          NAMES: "Fabien Mascourou|Teulier Patrice|Ferme de Cyrina|Fournier Bernard|Gironis Benoit|Gabeon|W & B|Pascal Paramelle|Pierre-Alain Taisne|Hyacinthe Menuiseries|Klene Mylene|Malabry Didier|Le Diouron LOIC|SCEA de Belinval|Vincent balligand|Nr aménagement"
          FROM: "vide,a_appeler"
        run: node scripts/marquer-deja-appeles.mjs
