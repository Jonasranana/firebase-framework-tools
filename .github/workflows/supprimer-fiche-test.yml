name: Supprimer une fiche de test Facebook (lancement manuel)
on:
  workflow_dispatch:
    inputs:
      fiche_id:
        description: "Identifiant de la fiche (fb_…)"
        required: true
      dry_run:
        description: "Essai à blanc (rien n'est supprimé)"
        type: boolean
        default: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Supprimer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          FICHE_ID: ${{ inputs.fiche_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/supprimer-fiche-test.mjs
