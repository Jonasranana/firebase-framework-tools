name: Sauvegarde et vérification du CRM

# Chaque nuit : 1) copie de toutes les données du CRM dans Storage (backups/AAAA-MM-JJ/, 30 jours
# conservés), 2) vérification que tous les documents et fichiers sont bien là. En cas de problème
# (fichier manquant, sauvegarde impossible) le workflow passe au rouge et GitHub envoie un e-mail.
# Lancement manuel possible ; « essai à blanc » = compte sans rien écrire.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc (n'écrit rien)"
        type: boolean
        default: false
      with_monday:
        description: "Inclure aussi l'archive Monday dans la sauvegarde"
        type: boolean
        default: false

concurrency:
  group: sauvegarde-crm
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Sauvegarde
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          WITH_MONDAY: ${{ github.event_name == 'workflow_dispatch' && inputs.with_monday && '1' || '0' }}
        run: node scripts/backup-crm.mjs
      - name: Vérification d'intégrité
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/check-crm-integrity.mjs
      - uses: google-github-actions/setup-gcloud@v2
        if: always()
      - name: Mail en français simple
        if: always()
        env:
          NOM: "sauvegarde-nuit"
          STATUT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          for s in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GMAIL_SENDER_EMAIL; do
            v=$(gcloud secrets versions access latest --secret=$s --project kachoto-7554c | tr -d '\r\n')
            echo "::add-mask::$v"
            export "$s=$v"
          done
          node scripts/alerte-mail.mjs
