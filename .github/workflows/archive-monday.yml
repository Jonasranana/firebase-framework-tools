name: Archive Monday vers CRM

# Copie TOUT Monday (tableaux, colonnes, étiquettes, commentaires, fichiers)
# dans le CRM, en lecture seule côté Monday. Voir scripts/import-monday-archive.mjs.
# 1) Lancer à la main avec « essai à blanc » : compte tout, n'écrit rien.
# 2) Relancer sans essai à blanc : l'archive démarre ; si elle n'est pas finie
#    à la fin des 5 h 30, la reprise est automatique (toutes les 6 h) jusqu'au bout.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc (n'écrit rien)"
        type: boolean
        default: true
      files:
        description: "Copier aussi les fichiers"
        type: boolean
        default: true
      refresh:
        description: "Repasser sur des tableaux déjà archivés : ne reprend que les lignes ou fichiers manquants"
        type: boolean
        default: false
      max_mb:
        description: "Taille maximale d'un fichier copié, en Mo"
        type: string
        default: "200"
      board_ids:
        description: "Facultatif : identifiants de tableaux séparés par des virgules (sinon tous)"
        type: string
        default: ""
  # Passage automatique arrêté : lancement manuel uniquement (workflow_dispatch).
  # schedule:
  #   - cron: "40 */6 * * *"

concurrency:
  group: archive-monday
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Archive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FILES: ${{ github.event_name == 'workflow_dispatch' && !inputs.files && '0' || '1' }}
          BOARD_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.board_ids || '' }}
          REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh && '1' || '0' }}
          MAX_MB: ${{ github.event_name == 'workflow_dispatch' && inputs.max_mb || '200' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          set +e
          node scripts/import-monday-archive.mjs
          code=$?
          # 3 = temps écoulé : normal, la reprise automatique continuera.
          if [ "$code" = "3" ]; then exit 0; fi
          exit $code
