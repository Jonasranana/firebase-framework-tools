name: Audit statuts semaine (lecture seule)

# Ne modifie rien. Compare les sauvegardes quotidiennes de la dernière semaine.
on:
  push:
    branches: [claude/optimistic-lamport-tc88wi]
    paths: [scripts/audit-statuts-semaine.mjs, .github/workflows/audit-statuts.yml]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Audit
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
        run: node scripts/audit-statuts-semaine.mjs
