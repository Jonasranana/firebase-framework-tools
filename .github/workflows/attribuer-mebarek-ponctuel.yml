name: Attribuer 50 fiches à Mebarek (ponctuel)

# Lancement ponctuel depuis la branche de travail : 50 fiches « À appeler » de « 0/ Contacts », non attribuées,
# attribuées à Mebarek et rangées dans « 1/Leads Mebarek ».
on:
  push:
    branches: [claude/optimistic-lamport-tc88wi]
    paths: [.github/workflows/attribuer-mebarek-ponctuel.yml]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Attribuer et ranger
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DRY_RUN: "false"
          COUNT: "50"
          WHO: Mebarek
          TO_GROUP: mebarek
        run: node scripts/attribuer-leads.mjs
