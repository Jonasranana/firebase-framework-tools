name: Sync boîte mail

# Toutes les 15 minutes (de 6 h à 22 h, heure de Paris environ) : demande à la
# fonction syncMailbox de ranger les nouveaux mails de contact@ dans les
# fiches du CRM. Le bouton « Actualiser » du CRM fait la même demande à la
# main. Lancement manuel possible depuis l'onglet Actions.
on:
  schedule:
    - cron: "*/15 5-20 * * *"
  workflow_dispatch:

concurrency:
  group: sync-mailbox
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Request mailbox sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/request-mail-sync.mjs
