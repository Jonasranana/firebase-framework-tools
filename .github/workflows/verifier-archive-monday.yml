name: Vérifier l'archive Monday

# Compare tous les tableaux de Monday avec l'archive du CRM (lignes, copie terminée, fichiers).
# Ne modifie rien. Lire le résultat à la fin du journal : « RÉSULTAT : OK » ou la liste des écarts.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Vérifier
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: node scripts/verify-monday-archive.mjs
