name: Restaurer une sauvegarde du CRM

# Remet une collection (ou un seul document) à l'état d'une sauvegarde. Sans danger par défaut :
# « essai à blanc » affiche seulement ce qui serait restauré. Ne supprime jamais rien.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Jour de la sauvegarde (AAAA-MM-JJ)"
        type: string
        required: true
      collection:
        description: "Collection (ex. crm_leads, crm_artisans, crm_documents)"
        type: string
        required: true
      doc_id:
        description: "Facultatif : un seul document (identifiant)"
        type: string
        default: ""
      dry_run:
        description: "Essai à blanc (n'écrit rien)"
        type: boolean
        default: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
      - name: Restaurer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: kachoto-7554c
          DAY: ${{ inputs.day }}
          COLLECTION: ${{ inputs.collection }}
          DOC_ID: ${{ inputs.doc_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/restore-crm-backup.mjs
