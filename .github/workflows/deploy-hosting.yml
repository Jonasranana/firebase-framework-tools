name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build

      # Copier-coller depuis un éditeur de texte peut injecter des
      # caractères parasites dans le secret ; on ne garde que l'ASCII
      # imprimable (suffisant pour un JSON de compte de service Google)
      # avant de le valider.
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
          python3 -m json.tool "$RUNNER_TEMP/sa.json" > /dev/null \
            && echo "Service account JSON is valid." \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not valid JSON even after sanitizing"; exit 1; }

      # Le site "ip5-energie" (URL de marque ip5-energie.web.app) est créé à
      # la volée s'il n'existe pas encore ; la commande échoue sans gravité
      # s'il existe déjà, d'où le `|| true`.
      - name: Ensure ip5-energie hosting site exists
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest hosting:sites:create ip5-energie --project kachoto-7554c --non-interactive || true

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest deploy --only hosting --project kachoto-7554c --non-interactive
