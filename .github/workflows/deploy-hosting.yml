name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build

      # Le secret a été copié depuis un éditeur de texte qui peut injecter
      # des caractères parasites (ex. « å ») : on ne garde que l'ASCII
      # imprimable, ce qui suffit pour un JSON de compte de service Google,
      # puis on valide le JSON avant de déployer.
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
          python3 -m json.tool "$RUNNER_TEMP/sa.json" > /dev/null \
            && echo "Service account JSON is valid." \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not valid JSON even after sanitizing"; exit 1; }

      # Diagnostic sans fuite : uniquement des booléens et des longueurs,
      # jamais le contenu de la clé (les logs de ce dépôt sont publics).
      - name: Check credentials shape
        run: |
          python3 - <<'EOF'
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/sa.json"))
          attendu = ["type","project_id","private_key_id","private_key","client_email","client_id","auth_uri","token_uri"]
          print("champs presents:", {k: (k in d) for k in attendu})
          print("type ==", repr(d.get("type")))
          print("project_id ==", repr(d.get("project_id")))
          pk = d.get("private_key", "")
          print("private_key commence par BEGIN:", pk.startswith("-----BEGIN PRIVATE KEY-----"))
          print("private_key contient END:", "-----END PRIVATE KEY-----" in pk)
          print("private_key longueur:", len(pk))
          print("private_key nb retours ligne:", pk.count("\n"))
          email = d.get("client_email", "")
          print("client_email se termine par gserviceaccount.com:", email.endswith("gserviceaccount.com"))
          EOF

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest deploy --only hosting --project kachoto-7554c --non-interactive
