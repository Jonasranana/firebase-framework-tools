name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build
      - run: node scripts/generate-sitemap.mjs

      # Copier-coller depuis un éditeur de texte peut injecter des
      # caractères parasites dans le secret ; on ne garde que l'ASCII
      # imprimable (suffisant pour un JSON de compte de service Google)
      # avant de le valider.
      - name: Prepare service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" | LC_ALL=C tr -cd '\11\12\15\40-\176' > "$RUNNER_TEMP/sa.json"
          python3 -m json.tool "$RUNNER_TEMP/sa.json" > /dev/null \
            && echo "Service account JSON is valid." \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not valid JSON even after sanitizing"; exit 1; }
          echo "Deploying as: $(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/sa.json'))['client_email'])")"

      # Le site "ip5-energie" (URL de marque ip5-energie.web.app) est créé à
      # la volée s'il n'existe pas encore ; la commande échoue sans gravité
      # s'il existe déjà, d'où le `|| true`.
      - name: Ensure ip5-energie hosting site exists
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest hosting:sites:create ip5-energie --project kachoto-7554c --non-interactive || true

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest deploy --only hosting --project kachoto-7554c --non-interactive

      # Firebase analyse le code des Functions localement avant de déployer
      # (pour lister les déclencheurs) : il faut donc leurs dépendances
      # installées ici, `npm ci` à la racine ne couvre que le site.
      - name: Install Functions dependencies
        run: npm ci --prefix functions

      # Envoi automatique de l'e-mail de signature (CRM Station de gonflage).
      # Nécessite le plan Blaze + les secrets GMAIL_* + des rôles IAM
      # supplémentaires pour ce compte de service (voir functions/README.md) :
      # tant que ce n'est pas fait, cette étape échoue sans bloquer le
      # déploiement du Hosting ci-dessus (continue-on-error).
      - name: Deploy Cloud Functions
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest deploy --only functions --project kachoto-7554c --non-interactive
